id: facebook_negative_spend
title: Negative spend from the Facebook connector
kind: data
description: >
  A refunded ad charge comes through as negative spend. Marketing spend feeds
  agg_channel's ROAS, so even though this is a marketing model it is
  quarantined by lineage.
faults:
  - op: set_value
    file: seeds/example/marketing/facebook_ads_ads.csv
    column: spend
    rows: [7]
    value: "-12.50"
expect:
  failing_tests:
    - {model: stg_facebook_ads__ads, test: positive_value, column: spend}
  verdicts: [data_issue]
  tier: quarantine
