version: 2

sources:
  - name: extract
    schema: extract
    config:
      loaded_at_field: _fivetran_synced
      freshness:
        warn_after: { count: 24, period: hour }
        error_after: { count: 48, period: hour }
    # Every raw table carries two warn-severity duplicate checks. Staging reads
    # each one through deduplicate_source() (macros/deduplicate_source.sql),
    # which collapses identical re-delivered copies and excludes keys whose
    # copies conflict, so neither stops the build. These tests make both
    # visible instead of silent:
    #   unique_combination_of_columns  any duplicate key: tell the upstream
    #                                  team their sync re-delivered rows
    #   no_conflicting_duplicates      keys whose versions disagree; the
    #                                  stored failures are the quarantine
    #                                  table (dbt_test__audit), excluded from
    #                                  staging until resolved at source
    tables:
      - name: exchange_rates
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [date, base_currency, target_currency]
              config:
                severity: warn
          - no_conflicting_duplicates:
              arguments:
                key_columns: [date, base_currency, target_currency]
              config:
                severity: warn
      - name: google_analytics_sessions
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [id]
              config:
                severity: warn
          - no_conflicting_duplicates:
              arguments:
                key_columns: [id]
              config:
                severity: warn
      - name: stripe_payments
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
