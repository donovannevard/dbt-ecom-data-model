models:
  - name: int_customer__enriched
    description: "Enriched customer data"
    columns:
      - name: id
        tests:
          - not_null
          - unique

  - name: int_marketing__combined
    description: "Combined & enriched marketing data from all marketing platforms"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - platform
              - ad_id
              - date

  - name: int_marketing__channel_classification
    description: "Classifies ad platform campaigns into the same channel taxonomy used for session classification"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - platform
              - campaign_id

  - name: int_order__enriched
    description: "Enriched order data"
    columns:
      - name: id
        tests:
          - not_null
          - unique

  - name: int_order__transactions
    description: "Order transaction history data"
    columns:
      - name: payment_date
        tests:
          - not_null_if_active:
              arguments:
                status_column: payment_status
                status_value: succeeded

  - name: int_order_items__enriched
    description: "Enriched order items data"
    columns:
      - name: id
        tests:
          - not_null
          - unique

  - name: int_product__enriched
    description: "Enriched product data"
    columns:
      - name: id
        tests:
          - not_null
          - unique

  - name: int_session__marketing_channel_classification
    description: "Determines the marketing channel for each session"
    columns:
      - name: session_id
        tests:
          - not_null
          - unique
